# =============================================================================
# Nginx configuration for the StockPilot frontend image.
#
# Two jobs, nothing else:
#   1. serve the compiled SPA, including BrowserRouter deep links
#   2. proxy /api/ to the backend, same-origin
#
# Runs as the unprivileged `nginx` user, which is why there is no `user`
# directive (nginx ignores it when the master is not root and warns about it),
# why the pid and scratch paths live under /tmp, and why logs go to the
# container's streams rather than /var/log/nginx.
# =============================================================================

worker_processes auto;

error_log /dev/stderr warn;

# The stock `combined` format logs $request — the full request line, query string
# included. StockPilot narrowed its own access log to the path for exactly this
# reason, so this follows suit: $uri and never $request or $request_uri.
#
# The Referer is omitted too: it is caller-controlled and can just as easily
# carry a query string. No request or response body is ever logged.
log_format stockpilot escape=json
  '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration":$request_time,"upstream":"$upstream_response_time",'
  '"ua":"$http_user_agent"}';

access_log /dev/stdout stockpilot;

# Unprivileged location: /tmp is writable without root.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    sendfile on;
    tcp_nopush on;

    # Matches the backend's 1mb JSON body cap (backend/src/app.ts).
    client_max_body_size 1m;

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Backend service. The `api` hostname is the Docker service name; override by
    # editing this file or mounting your own if the service is named otherwise.
    upstream stockpilot_api {
        server api:4000;
        keepalive 16;
    }

    # Temp paths must be writable by the unprivileged user.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    server {
        # Above the privileged range so no root capability is required.
        listen 8080;
        listen [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- API ------------------------------------------------------------
        # Ownership of /api/health and /api/ready stays with the backend: this
        # block adds no rewriting, no caching and no error substitution for
        # statuses the backend produces.
        location /api/ {
            # No URI part after the upstream, so the original path *and* its
            # query string are forwarded untouched.
            proxy_pass http://stockpilot_api;

            proxy_http_version 1.1;
            # Empty Connection header enables upstream keepalive.
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Nginx is the single trusted hop, which is what the backend's
            # mandatory TRUST_PROXY production setting expects.
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # 502/504 can only be produced by the proxy itself — Express never
            # emits them — so they are safe to replace with a generic body.
            # 503 is deliberately NOT intercepted: it is the backend's own
            # /api/ready signal and must reach the caller unchanged.
            error_page 502 504 = @upstream_unreachable;
        }

        location @upstream_unreachable {
            default_type application/json;
            return 503 '{"status":"error","error":"Service Unavailable","code":"UPSTREAM_UNAVAILABLE"}';
        }

        # ---- This container's own health -------------------------------------
        # Nginx-local only; never touches the backend, so a database outage
        # cannot make Docker restart a healthy front end.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- Fingerprinted assets -------------------------------------------
        # Vite emits content-hashed filenames, so these are safe to pin for a
        # year. Cache-Control is set with add_header only: combining `expires`
        # with an explicit Cache-Control would emit the header twice.
        location /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ---- The SPA entry point ---------------------------------------------
        # Never cached: it is the file that references the hashed assets, so a
        # stale copy would pin users to old bundles.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        location = /favicon.svg {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # ---- BrowserRouter deep links ----------------------------------------
        # /app/inventory/<id> must return index.html, not 404, or a page refresh
        # or a shared link breaks.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}