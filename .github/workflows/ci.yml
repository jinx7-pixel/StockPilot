# StockPilot — Continuous Integration
#
# Verifies that every push to main and every pull request targeting main
# installs, lints, type-checks and builds cleanly.
#
# Deliberately NOT in this workflow:
#   - no deployment (CD comes in a later milestone)
#   - no PostgreSQL service container and no `migration:up`
#     None of the steps below connect to a database, so CI needs no
#     credentials and no secrets. Add a service container when the project
#     grows database-backed tests.
#
# Actions are pinned to exact release tags rather than floating major
# versions, so a run is reproducible. Bump them deliberately.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR instead of queueing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `lint` and `typecheck` also cover database/migrations (see the
      # migrations job for those steps run in isolation).
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Migrations are a separate TypeScript/ESLint project that borrows the
      # tooling from this package's node_modules, so installing backend
      # dependencies is all that is required. No database is contacted.
      - name: Install migration dependencies
        run: npm ci

      - name: Type check migrations
        run: npm run typecheck:migrations

      - name: Lint migrations
        run: npm run lint:migrations
