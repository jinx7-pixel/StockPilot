# StockPilot — Continuous Integration
#
# Verifies that every push to main and every pull request targeting main
# installs, lints, type-checks and builds cleanly.
#
# Deliberately NOT in this workflow:
#   - no deployment (CD comes in a later milestone)
#   - no `migration:up` against a shared or production database
#
# The `backend-tests` job does run against a PostgreSQL service container, but
# only a throwaway one created for that job, seeded with CI-only credentials.
# Nothing here needs a repository secret, and nothing touches a real database.
#
# Actions are pinned to exact release tags rather than floating major
# versions, so a run is reproducible. Bump them deliberately.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR instead of queueing them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Runs before the build so a transport regression fails in ~2 seconds
      # rather than after a full bundle. `vitest run` executes once and exits; it
      # needs no service container, no database and no network.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `lint` and `typecheck` also cover database/migrations (see the
      # migrations job for those steps run in isolation).
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Migrations are a separate TypeScript/ESLint project that borrows the
      # tooling from this package's node_modules, so installing backend
      # dependencies is all that is required. No database is contacted.
      - name: Install migration dependencies
        run: npm ci

      - name: Type check migrations
        run: npm run typecheck:migrations

      - name: Lint migrations
        run: npm run lint:migrations

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # The suite runs against a throwaway database, never a real one.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Ephemeral CI-only credentials. GitHub-hosted runners are discarded
          # after the job, so these are not secrets — and must never be reused
          # for a real environment.
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: stockpilot
      PGPASSWORD: stockpilot_ci_only
      PGDATABASE: postgres
      # The suite creates this database, applies the migrations to it, and
      # truncates it between tests. `src/tests/setup.ts` points the connection
      # at it and refuses to run if it matches the configured database.
      TEST_PGDATABASE: stockpilot_test
      NODE_ENV: test
      # Plain HTTP on the runner, so the Secure cookie flag must be off.
      COOKIE_SECURE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
